<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPR 研究用網頁系統 V1.0.8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CPR 研究用網頁系統 V1.0.8</h1>

        <!-- 設定區域 -->
        <div class="settings-section">
            <h2>設定參數</h2>

            <div class="form-group">
                <label for="subjectCode">受試者代碼:</label>
                <input 
                    type="text" 
                    id="subjectCode" 
                    placeholder="例如: S01"
                    maxlength="10"
                >
            </div>

            <div class="form-group">
                <label for="testPhase">測驗階段:</label>
                <select id="testPhase">
                    <option value="">-- 請選擇 --</option>
                    <option value="pretest">pretest</option>
                    <option value="practice1">practice1</option>
                    <option value="practice2">practice2</option>
                    <option value="practice3">practice3</option>
                    <option value="practice4">practice4</option>
                    <option value="retention">retention</option>
                </select>
            </div>
        </div>

        <!-- 攝影機控制區域 -->
        <div class="camera-section">
            <h2>攝影機</h2>

            <div class="form-group">
                <label for="cameraSelect">攝影機來源:</label>
                <select id="cameraSelect">
                    <option value="">預設攝影機（優先後鏡頭 / 外接鏡頭）</option>
                </select>
            </div>

            <div class="button-group">
                <button id="refreshCamerasBtn" class="btn btn-secondary">重新整理攝影機清單</button>
                <button id="startCameraBtn" class="btn btn-primary">啟動攝影機</button>
                <button id="stopCameraBtn" class="btn btn-danger" disabled>停止攝影機</button>
            </div>

            <div class="camera-warning">
                <p><strong>⚠️ 重要提醒：</strong></p>
                <p>正式測試前請關閉背景模糊、自動取景、人像置中、臉部追蹤等攝影機效果，並確認畫面可完整拍到受試者側面、手臂、軀幹與 CPR 模擬人。</p>
                <p>若要使用 USB 外接攝影機，建議先插入 USB 攝影機，再按「重新整理攝影機清單」。手機測試時可在清單中選擇前鏡頭或後鏡頭。</p>
            </div>

            <div class="video-container">
                <video id="videoPreview" playsinline autoplay muted></video>
                <canvas id="videoCanvas" style="display: none;"></canvas>

                <div id="videoStatusOverlay" class="video-overlay video-status-overlay status-idle">待機</div>
                <div id="videoTimerOverlay" class="video-overlay video-timer-overlay timer-large">02:00</div>
                <div id="preCountdownOverlay" class="video-overlay pre-countdown-overlay hidden"></div>
            </div>

            <div id="cameraStatus" class="status-message"></div>
        </div>

        <!-- 錄製控制區域 -->
        <div class="recording-section">
            <h2>錄製</h2>

            <div class="duration-options">
                <span class="duration-label">錄影長度：</span>
                <label class="duration-option">
                    <input type="radio" name="recordingLength" value="30"> 
                    30 秒
                </label>
                <label class="duration-option">
                    <input type="radio" name="recordingLength" value="60"> 
                    1 分鐘
                </label>
                <label class="duration-option">
                    <input type="radio" name="recordingLength" value="120" checked> 
                    2 分鐘
                </label>
            </div>

            <div class="timer-size-options">
                <span class="duration-label">倒數時間大小：</span>
                <label class="duration-option">
                    <input type="radio" name="timerSize" value="normal"> 
                    一般字
                </label>
                <label class="duration-option">
                    <input type="radio" name="timerSize" value="large" checked> 
                    大字模式
                </label>
            </div>

            <div class="button-group">
                <button id="startRecordingBtn" class="btn btn-success" disabled>開始錄製</button>
                <button id="stopRecordingBtn" class="btn btn-danger" disabled>停止錄製</button>
            </div>

            <div id="prepCountdown" class="prep-countdown">準備就緒</div>
            <div id="timerDisplay" class="timer">00:00</div>
            <div id="recordingStatus" class="status-message"></div>
        </div>

        <!-- 下載區域 -->
        <div class="download-section">
            <h2>下載</h2>
            <button id="downloadBtn" class="btn btn-info" disabled>下載影片</button>
            <div id="downloadStatus" class="status-message"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
